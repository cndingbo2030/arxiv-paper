[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "score-bip"
version = "0.1.0"
description = "Exploratory code for learned Ornstein--Uhlenbeck drift priors in Bayesian inverse problems"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bo Ding" }]
keywords = ["bayesian", "inverse-problems", "score-based", "diffusion", "applied-math"]
dependencies = [
    "torch>=2.2",
    "lightning>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.66",
    "einops>=0.7",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/score_bip"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
